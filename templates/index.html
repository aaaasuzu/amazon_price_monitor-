<!DOCTYPE html>
<html>
<head>
    <title>価格監視ツール</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h1 class="mb-4">Amazon価格監視ツール</h1>

    <form method="POST" class="row g-2 mb-4">
        <div class="col">
        <input class="form-control" type="text" name="name" placeholder="商品名" required>

        </div>
        <div class="col">
        <input class="form-control" type="text" name="url" placeholder="URL" required>
    </div>
        <div class="col">
        <input class="form-control" type="number" name="target_price" placeholder="目標価格" required>
    </div>
    <div class="col">
        <button class="btn btn-primary">追加</button>
        </div>
    </form>

    <table class="table table-bordered">
    <thead>
        <tr>
            <th>商品名</th>
            <th>現在価格</th>
            <th>目標価格</th>
        </tr>
    </thead>
    <tbody>
        {% for p in products %}
            <tr>
                <td>{{ p.name }}</td>
                <td>{{ p.price }}円</td>
                <td>{{ p.target_price }}円</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</body>
</html>
